<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Photo App</title>
    <Link rel="stylesheet" type="text/css" href="style.css" />
      
      
   
  </head>
  <body>
    
    <h2 class=" lobster-two-regular-italic">CatPhotoApp</h2>
    <main>
      <h3>Cat Photo's</h3>
      <!-- TOdO: Add link to cat photos.-->

      <p class="red-text">
        Click here to vieuw more <a href="#" target="_blank">cat photos.</a>
      </p>

      <a href="#"
        ><img src="https://unsplash.it/200/150/"
        alt="A cute 
        Cat" class="thick-green-border">
      </a>
      <h3>Things cats <em>love</em></h3>
      <div class="lists">
        <ul>
          <li>cat nip</li>
          <li>laser pointers</li>
          <li>lasagna</li>
        </ul>
        <img src="lasagna.jpg" height="150px" width="150px" alt="lasagna" />
        <br />Photo by
        <a
          href="https://unsplash.com/@parnissazimi?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash"
          >Parnis Azimi</a
        >
        on
        <a
          href="https://unsplash.com/photos/a-white-plate-topped-with-lasagna-covered-in-spinach-YGEne25RWPI?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash"
          >Unsplash</a
        >
        <p>Things cats <strong>hate</strong></p>
        <ol>
          <li>flea treatment</li>
          <li>thunder</li>
          <li>other cats</li>
        </ol>
      </div>
      <img
        src="https://unsplash.it/200/150/"
        alt="A cute 
        Cat"
      />
      <form action="submit-cat-photo" id="cat-photo_form">
        <label for="indoor"
          ><input
            id="indoor"
            type="radio"
            name="indoor-outdoor"
            checked
          />indoor</label
        ><br />
        <label for="outdoor"
          ><input
            id="outdoor"
            type="radio"
            name="indoor-outdoor"
          />outdoor</label
        ><br />
        <label for="lazy"
          ><input id="loving" type="checkbox" name="personality" checked />
          Lazy</label
        ><br />
        <label for="loving"
          ><input id="loving" type="checkbox" name="personality" />
          Loving</label
        ><br />
        <label for="loving"
          ><input id="Energetic" type="checkbox" name="personality" />
          Enegetic</label
        >
        <input type="text" placeholder="cat photo url" required /><br />
        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <p></p><small>
        No Copyright - <a href="https://freecodecamp.org">freeCodeamp.org</a>
      </small>
      </p>
    </footer>
  </body>
</html>
